<style>

.pm-ring.restamp{animation:restamp .45s cubic-bezier(.2,.9,.3,1.25) both}
.pm-waves.restamp{animation:fadein .5s .12s both}

<section class="ls" data-page="9" data-requires="s9h" hidden><span class="pmark" aria-hidden="true"></span><h2 data-i18n="s9h"></h2><p data-i18n-html="s9p1"></p>

<dialog id="lang-dialog" aria-labelledby="lang-title"><div class="dlg"><h2 id="lang-title" data-i18n="dialogTitle"></h2><ul id="lang-list" class="lang-list"></ul><button id="lang-close" class="dlg-close" type="button" data-i18n="close"></button></div></dialog>
<script>
(function(){
"use strict";
var I18N=/*__I18N__*/null;
var ORDER=/*__ORDER__*/["en"];
var RTL={fa:true};
var LINKS=[{k:"linkMedium",href:"https://medium.com/@kbookmaster"},{k:"linkInsta",href:"https://www.instagram.com/masterkbook/"},{k:"linkReddit",href:"https://www.reddit.com/user/Former_monk_KR/"},{k:"linkEt",href:"https://ebaonnestunudmunk.blogspot.com/"}];
/* Ko-fi 주소가 생기면 아래 두 곳에 넣기 */
var SUPPORT={coffee:"",brick:""};
var KEY="lwb.lang",root=document.documentElement,current="en",showFallback=false,lastTrigger=null,routed=false;
var cardView=document.getElementById("view-card"),letterView=document.getElementById("view-letter"),dlg=document.getElementById("lang-dialog"),list=document.getElementById("lang-list"),fallbackEl=document.getElementById("fallback");
function each(sel,fn){var els=document.querySelectorAll(sel);for(var i=0;i<els.length;i++)fn(els[i]);}
function load(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
function save(v){try{localStorage.setItem(KEY,v);}catch(e){}}
function base(tag){return String(tag||"").toLowerCase().split("-")[0];}
function detect(){
var p=null;try{p=new URLSearchParams(location.search).get("lang");}catch(e){}
if(p&&I18N[p])return{lang:p};
var s=load();if(s&&I18N[s])return{lang:s};
var prefs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
var firstOk=!!I18N[base(prefs[0])];
for(var i=0;i<prefs.length;i++){var b=base(prefs[i]);if(I18N[b])return{lang:b,firstUnsupported:!firstOk&&!!prefs[0]};}
return{lang:"en",firstUnsupported:!!prefs[0]};
}
function fmtPage(t,n){var s=String(n);try{s=new Intl.NumberFormat(t._htmlLang).format(n);}catch(e){}return t.pageFmt.replace("{n}",s);}
function renderLinks(t){
each("[data-links]",function(ul){
ul.textContent="";
LINKS.forEach(function(l){var li=document.createElement("li"),a=document.createElement("a");a.href=l.href;a.target="_blank";a.rel="noopener";a.textContent=t[l.k];li.appendChild(a);ul.appendChild(li);});
var li=document.createElement("li"),lab=document.createElement("span"),ph=document.createElement("span");
li.className="email";lab.textContent=t.emailLabel+" ";ph.className="placeholder";ph.textContent=t.emailPlaceholder;li.appendChild(lab);li.appendChild(ph);ul.appendChild(li);
});
}
function orient(rtl){
each(".postmark",function(svg){
svg.querySelector(".pm-pos").setAttribute("transform",rtl?"translate(150 56) rotate(12)":"translate(50 56) rotate(-12)");
svg.querySelector(".pm-waves").setAttribute("transform",rtl?"translate(200 0) scale(-1 1)":"translate(0 0)");
});
}
function restamp(){
var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
if(reduce)return;
each(".pm-ring, .pm-waves",function(g){g.classList.remove("restamp");void document.body.offsetWidth;g.classList.add("restamp");});
}
function apply(lang,animate){
var t=I18N[lang]||I18N.en;current=I18N[lang]?lang:"en";
root.lang=t._htmlLang;root.dir=RTL[current]?"rtl":"ltr";document.title=t.title;
each("[data-i18n]",function(el){var v=t[el.getAttribute("data-i18n")];if(typeof v==="string")el.textContent=v;});
each("[data-i18n-html]",function(el){var v=t[el.getAttribute("data-i18n-html")];if(typeof v==="string")el.innerHTML=v;});
each("[data-i18n-aria]",function(el){var v=t[el.getAttribute("data-i18n-aria")];if(v)el.setAttribute("aria-label",v);});
each("[data-langname]",function(el){el.textContent=t.langName;});
each("[data-page]",function(el){var m=el.querySelector(".pmark");if(m)m.textContent=fmtPage(t,+el.getAttribute("data-page"));});
renderLinks(t);
each("[data-requires]",function(el){el.hidden=!t[el.getAttribute("data-requires")];});
each("[data-support]",function(a){var u=SUPPORT[a.getAttribute("data-support")];if(u){a.href=u;a.target="_blank";a.rel="noopener";a.classList.remove("is-pending");a.removeAttribute("aria-disabled");}else{a.removeAttribute("href");a.classList.add("is-pending");a.setAttribute("aria-disabled","true");}});
each("[data-pending-for]",function(el){el.hidden=!!SUPPORT[el.getAttribute("data-pending-for")];});
each(".lang-stamp",function(b){b.setAttribute("aria-pressed",b.getAttribute("data-code")===current?"true":"false");});
fallbackEl.hidden=!(showFallback&&current==="en");
orient(!!RTL[current]);
if(animate)restamp();
}
function openDlg(trigger){
lastTrigger=trigger;
if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
var cur=list.querySelector('[aria-pressed="true"]')||list.querySelector("button");if(cur)cur.focus();
}
function closeDlg(){
if(dlg.open){if(typeof dlg.close==="function")dlg.close();else dlg.removeAttribute("open");}
if(lastTrigger)lastTrigger.focus();
}
ORDER.forEach(function(code){
var t=I18N[code];if(!t)return;
var li=document.createElement("li"),b=document.createElement("button"),s=document.createElement("span");
b.type="button";b.className="lang-stamp";b.setAttribute("data-code",code);b.lang=t._htmlLang;b.dir=RTL[code]?"rtl":"ltr";
s.textContent=t.langName;b.appendChild(s);
b.addEventListener("click",function(){save(code);showFallback=false;apply(code,true);closeDlg();});
li.appendChild(b);list.appendChild(li);
});
each("[data-open-lang]",function(b){b.addEventListener("click",function(){openDlg(b);});});
document.getElementById("lang-close").addEventListener("click",closeDlg);
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDlg();});
function route(){
var isLetter=location.hash==="#letter";
cardView.hidden=isLetter;letterView.hidden=!isLetter;
if(routed){window.scrollTo(0,0);var h=(isLetter?letterView:cardView).querySelector("h1");if(h)h.focus({preventScroll:true});}
routed=true;
}
window.addEventListener("hashchange",route);
document.getElementById("skip").addEventListener("click",function(e){e.preventDefault();var h=(letterView.hidden?cardView:letterView).querySelector("h1");if(h)h.focus();});
var r=detect();showFallback=!!(r.firstUnsupported&&r.lang==="en");
apply(r.lang,true);
route();
})();
</script>
